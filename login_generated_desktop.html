<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ShopCanvas | Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a47c2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased overflow-hidden">
<div class="flex min-h-screen w-full">
<!-- Left Side: Hero Image Section -->
<div class="hidden lg:flex lg:w-1/2 relative overflow-hidden bg-slate-900">
<div class="absolute inset-0 bg-cover bg-center" data-alt="High-end luxury fashion editorial photography showing elegant minimalist apparel" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCeAfIGueNHfekTijBAJpawtoCjJh_u-yzXc3i_f0kgyhmNwNlLOkR8t9ZlmzIL81icurIT40AnMjMcES2nUdkbOSGLyva3P4zf1x7UOJxUTudQ6b3qphjXA3ecSC3zRhmLeTeTsnvgtcisEvm7TxS8MkaYL1ZAIkWhhkIeoObLv6FFsI4gSyta9_9Ao0ve_2SWi8Kot0zETklCYrtD0G_q9RH_Bxo1TrSd60G0r6XXmy_VEuhSKdvqe4oAcjUT2n8NCCz5ZeR5Peu_');">
</div>
<!-- Overlay Gradient -->
<div class="absolute inset-0 bg-gradient-to-t from-background-dark/80 via-transparent to-transparent"></div>
<div class="absolute bottom-16 left-16 max-w-md">
<div class="flex items-center gap-3 text-white mb-6">
<div class="size-8">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z" fill="currentColor"></path>
</svg>
</div>
<span class="text-2xl font-bold tracking-tight">ShopCanvas</span>
</div>
<h1 class="text-4xl font-extrabold text-white leading-tight mb-4">Elevate Your Wardrobe Experience.</h1>
<p class="text-slate-300 text-lg">Access your curated selection of premium high-end fashion and designer labels.</p>
</div>
</div>
<!-- Right Side: Login Form Section -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-24 bg-background-light dark:bg-background-dark">
<div class="w-full max-w-md flex flex-col gap-8">
<!-- Logo & Heading -->
<div class="flex flex-col gap-2">
<div class="lg:hidden flex items-center gap-3 text-primary mb-4">
<div class="size-6">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z" fill="currentColor"></path>
</svg>
</div>
<span class="text-xl font-bold tracking-tight">ShopCanvas</span>
</div>
<h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Sign In</h2>
<p class="text-slate-500 dark:text-slate-400">Welcome back to your premium fashion destination.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6" onsubmit="return false;">
<div class="flex flex-col gap-4">
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Email Address</span>
<input class="form-input w-full rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary h-14 px-4 transition-all" placeholder="name@example.com" type="email"/>
</label>
<label class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Password</span>
<a class="text-xs font-semibold text-primary hover:text-primary/80 transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<input class="form-input w-full rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary h-14 pl-4 pr-12 transition-all" placeholder="Enter your password" type="password"/>
<button class="absolute right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined text-[22px]">visibility</span>
</button>
</div>
</label>
</div>
<div class="flex items-center gap-2">
<input class="rounded border-slate-300 dark:border-slate-700 text-primary focus:ring-primary/30 size-4 bg-transparent" id="remember" type="checkbox"/>
<label class="text-sm text-slate-600 dark:text-slate-400" for="remember">Remember me for 30 days</label>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group">
                        Sign In
                        <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
<span class="flex-shrink mx-4 text-xs font-medium text-slate-400 uppercase tracking-widest">Or continue with</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 px-4 py-3 border border-slate-200 dark:border-slate-800 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors font-semibold text-slate-700 dark:text-slate-300">
<svg class="size-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Google
                    </button>
<button class="flex items-center justify-center gap-3 px-4 py-3 border border-slate-200 dark:border-slate-800 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors font-semibold text-slate-700 dark:text-slate-300">
<svg class="size-5 fill-current" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.04 1.72-3.23 1.72-1.16 0-1.52-.72-2.87-.72-1.36 0-1.76.7-2.84.72-1.19 0-2.31-.83-3.26-1.76C3 18.25 1.5 14.61 1.5 11.23c0-3.35 2.11-5.12 4.14-5.12 1.03 0 2 .61 2.63.61.64 0 1.64-.64 2.87-.64 1.25 0 2.45.45 3.33 1.48-3.08 1.67-2.58 6.02.51 7.37-.8 1.99-1.85 3.96-3.43 5.35zM12.19 4.84c0-2.5 2.06-4.59 4.54-4.59.18 2.5-2.12 4.79-4.54 4.59z"></path>
</svg>
                        Apple
                    </button>
</div>
<!-- Footer Text -->
<p class="text-center text-slate-500 dark:text-slate-400 text-sm">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline underline-offset-4 ml-1" href="#">Create an account</a>
</p>
</div>
</div>
</div>
</body></html>
